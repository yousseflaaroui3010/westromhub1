<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Guarantees | Westrom Group</title>
  <meta name="description" content="The Westrom Group guarantees: 12-month tenant placement, eviction protection, $3,000 pet assurance, happiness, 90-day money-back, and no-markup maintenance.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://wgcassetguide.com/guarantees">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <style>
    :root {
      --color-primary: #002045;
      --color-canvas: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-canvas);
      color: #1b1c1c;
      line-height: 1.5;
      overflow-x: hidden;
    }
    .skip-link {
      position: absolute;
      inset-inline-start: 1rem;
      top: -3rem;
      background: #fff;
      color: var(--color-primary);
      padding-block: 0.5rem;
      padding-inline: 1rem;
      border-radius: 0.5rem;
      z-index: 100;
      transition: top 0.15s ease;
      font-weight: 600;
    }
    .skip-link:focus { top: 0.5rem; }
    .visually-hidden {
      position: absolute; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* Header: mirrors the React app's PublicHeader (white bar, text nav,
       red "Free rental analysis" call to action). Keep the two in sync. */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #e2e5ea;
      color: #0f1b2d;
    }
    .site-header .wrap {
      max-width: 72rem;
      margin-inline: auto;
      padding-inline: 1.25rem;
      min-block-size: 4.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
    }
    .site-header a.brand { display: flex; align-items: center; text-decoration: none; }
    .site-header a.brand img { block-size: 3rem; inline-size: auto; }
    .site-nav {
      margin-inline-start: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      align-items: center;
    }
    .site-nav a {
      color: #475467;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.55rem 0.75rem;
      border-radius: 0.5rem;
    }
    .site-nav a:hover { background: #f1f5f9; color: #0f1b2d; }
    .site-nav a[aria-current="page"] { color: #002045; box-shadow: inset 0 -2px 0 #b61710; border-radius: 0; }
    .site-nav a.nav-cta {
      margin-inline-start: 0.5rem;
      background: #b61710;
      color: #fff;
      border-radius: 0.75rem;
      padding-inline: 1rem;
    }
    .site-nav a.nav-cta:hover { background: #93120c; color: #fff; }
    .site-nav a.nav-cta[aria-current="page"] { box-shadow: none; border-radius: 0.75rem; }
    .site-nav-toggle { display: none; }
    @media (max-width: 767px) {
      .site-header .wrap { min-block-size: 4rem; }
      .site-header a.brand img { block-size: 2.5rem; }
      .site-nav-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-inline-start: auto;
        inline-size: 44px;
        block-size: 44px;
        background: transparent;
        color: #002045;
        border: 0;
        border-radius: 0.75rem;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
      }
      .site-nav-toggle:hover { background: #f1f5f9; }
      .site-nav {
        display: none;
        flex-basis: 100%;
        inline-size: 100%;
        margin-inline-start: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 0.15rem;
        padding-block: 0.25rem 0.75rem;
      }
      .site-nav.open { display: flex; }
      .site-nav a { padding: 0.8rem 1rem; font-size: 1rem; }
      .site-nav a[aria-current="page"] { box-shadow: none; background: #e8edf5; border-radius: 0.75rem; }
      .site-nav a.nav-cta { margin-inline-start: 0; margin-block-start: 0.5rem; text-align: center; }
    }

    main { display: block; padding-block: 1.5rem 3rem; padding-inline: 1rem; }

    .nojs {
      max-width: 44rem;
      margin-inline: auto;
      padding: 1.25rem;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
    }
    .nojs h1 { margin-block-start: 0; }
    .nojs li { margin-block-end: 0.75rem; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Westrom Group, go to homepage">
        <img src="/westrom-logo.webp" alt="" width="2048" height="1186">
      </a>
      <button class="site-nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
      <nav class="site-nav" id="site-nav" aria-label="Site">
        <a href="/taxes">Property Taxes</a>
        <a href="/insurance">Insurance</a>
        <a href="/guarantees" aria-current="page">Guarantees</a>
        <a href="/analysis" class="nav-cta">Free rental analysis</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- The poster below renders its own visual title inside a shadow root,
         which is invisible to the page outline; this gives the page its h1. -->
    <h1 class="visually-hidden">Westrom Group guarantees</h1>
    <!-- Guarantees poster widget (shadow DOM, self-contained). If JS is
         disabled the noscript block below still lists every guarantee. -->
    <noscript>
      <div class="nojs">
        <h1>Westrom Group Guarantees</h1>
        <p>Built on confidence. Backed by protection. Focused on your peace of mind.</p>
        <ul>
          <li><strong>12 Month Tenant Placement Guarantee.</strong> If a resident we place breaks their lease within the first 12 months, we will find a qualified replacement resident at no additional leasing fee.</li>
          <li><strong>Eviction Protection Guarantee.</strong> If a Westrom screened resident must be evicted, we will guide you through the eviction process and cover eligible eviction related expenses up to $1,000.</li>
          <li><strong>$3,000 Pet Assurance Guarantee.</strong> You receive up to $3,000 in added protection for qualifying pet damage caused by an approved resident's pet.</li>
          <li><strong>Happiness Guarantee.</strong> If you are unhappy with our service, you may terminate with a simple email, without unnecessary cancellation penalties or a long term obligation.</li>
          <li><strong>90 Day Money Back Guarantee.</strong> If you are not satisfied with our management services during your first 90 days, we will refund the monthly management fees you paid.</li>
          <li><strong>No Maintenance Markup Guarantee.</strong> You will never pay extra on top of the actual maintenance cost. What you pay is what it costs.</li>
        </ul>
      </div>
    </noscript>

    <div id="wgc-guarantees"></div>
    <script src="/guarantees.js" async data-variant="full"></script>
  </main>

  <script src="/site-nav.js" defer></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "Westrom Group Guarantees",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "12 Month Tenant Placement Guarantee" },
      { "@type": "ListItem", "position": 2, "name": "Eviction Protection Guarantee" },
      { "@type": "ListItem", "position": 3, "name": "$3,000 Pet Assurance Guarantee" },
      { "@type": "ListItem", "position": 4, "name": "Happiness Guarantee" },
      { "@type": "ListItem", "position": 5, "name": "90 Day Money Back Guarantee" },
      { "@type": "ListItem", "position": 6, "name": "No Maintenance Markup Guarantee" }
    ]
  }
  </script>
</body>
</html>
