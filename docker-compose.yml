# Docker Compose v2+ — no 'version' key needed (deprecated in Compose v2)
# No AI and no cloud model keys: documents are read by ./extractor (Docling).
# The first build downloads the Docling/RapidOCR models into the image.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    environment:
      - API_UPSTREAM=http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships with wget
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      # nginx forwards the browser's Origin; allow the compose frontend.
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000
      - EXTRACTOR_URL=http://extractor:8080
    depends_on:
      extractor:
        condition: service_healthy
    healthcheck:
      # node:20-alpine ships with wget
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  extractor:
    build:
      context: ./extractor
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
